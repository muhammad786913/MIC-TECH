  </filter></defs>
  <rect width="1600" height="1000" fill="#151515"/>
  <g>
    <rect width="1600" height="1000" fill="#151515"/>
    <polygon points="0,1000 620,0 980,0 360,1000" fill="#F5F2EA" opacity=".08"/>
    <polygon points="520,1000 1140,0 1320,0 700,1000" fill="#C5A24B" opacity=".9"/>
    <polygon points="1080,1000 1420,480 1520,480 1180,1000" fill="#F5F2EA" opacity=".85"/>
    <rect x="120" y="120" width="240" height="2" fill="#C5A24B"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".8"/>
  <text x="1540" y="955" text-anchor="end" font-family="Arial, sans-serif" font-size="22" letter-spacing="7" fill="#C5A24B" opacity=".9">MIC TECH</text>
</svg>