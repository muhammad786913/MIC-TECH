  </filter></defs>
  <rect width="1600" height="1000" fill="#151515"/>
  <g>
    <rect width="1600" height="1000" fill="#151515"/>
    <text x="110" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="640" fill="#F5F2EA" letter-spacing="-20">MIC</text>
    <rect x="116" y="760" width="760" height="10" fill="#C5A24B"/>
    <text x="118" y="860" font-family="Arial, sans-serif" font-size="52" letter-spacing="18" fill="#C5A24B">TECH</text>
    <circle cx="1330" cy="210" r="120" fill="#C5A24B"/>
    <circle cx="1330" cy="210" r="160" fill="none" stroke="#F5F2EA" stroke-width="2" opacity=".4"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".8"/>
  <text x="1540" y="955" text-anchor="end" font-family="Arial, sans-serif" font-size="22" letter-spacing="7" fill="#C5A24B" opacity=".9">MIC TECH</text>
</svg>